<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Draw &amp; Find</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7fbff;
      color: #12233d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(420px, calc(100vw - 40px));
      text-align: center;
    }

    .appIcon {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: block;
      box-shadow: 0 14px 30px rgba(18, 35, 61, .16);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 22px;
      color: #4b5d75;
      line-height: 1.45;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: #12cfc5;
      color: #062528;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(18, 207, 197, .28);
    }

    .missing a {
      background: #e9eef5;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main id="content">
    <img class="appIcon" src="/icons/Icon-192.png" alt="Draw &amp; Find">
    <h1>Opening Draw &amp; Find</h1>
    <p>Taking you to this shared artbook in the app.</p>
    <a id="openLink" href="/">Open in app</a>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var artbook = params.get("artbook");
      var pathParts = window.location.pathname.split("/").filter(Boolean);

      if (!artbook && pathParts[0] === "artbook" && pathParts[1]) {
        artbook = pathParts[1];
      }

      if (!artbook && pathParts.length === 1 && pathParts[0] !== "index.html") {
        artbook = pathParts[0];
      }

      var content = document.getElementById("content");
      var openLink = document.getElementById("openLink");

      if (!artbook) {
        content.className = "missing";
        content.querySelector("h1").textContent = "Artbook link missing";
        content.querySelector("p").textContent = "This link does not include an artbook id.";
        openLink.textContent = "Open Draw & Find";
        openLink.href = "https://leasolbok.github.io/";
        return;
      }

      var appLink = "https://leasolbok.github.io/index.html?artbook=" +
        encodeURIComponent(artbook);
      openLink.href = appLink;

    })();
  </script>
</body>
</html>
